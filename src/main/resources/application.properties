spring.application.name=starapp

# Configuracao do banco MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/starapp
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do banco Postgres
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver





# Configuracao do JPA
spring.jpa.hibernate.ddl-auto=update     

# Configuracoes de exibicao de SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=truel