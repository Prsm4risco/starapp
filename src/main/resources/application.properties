spring.application.name=starapp
server.servlet.context-path=/starapp
logging.level.com.starapp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Configuracao do banco MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/starapp
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do banco Postgres
